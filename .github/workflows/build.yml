
name: Build Immortal Realms APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.py'
      - 'screens/**'
      - 'buildozer.spec'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake

          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer Cython==0.29.34 virtualenv

      - name: Prepare project
        run: |
          mkdir -p immortal_realms

          cp main.py immortal_realms/main.py
          cp -r screens immortal_realms/screens

          touch immortal_realms/__init__.py
          touch immortal_realms/screens/__init__.py

          cat > main.py <<'PY'
          from immortal_realms.main import ImmortalRealmsApp
          ImmortalRealmsApp().run()
          PY

      - name: Build Android APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Immortal-Realms-APK
          path: bin/*.apk
          if-no-files-found: error
