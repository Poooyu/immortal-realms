
name: Build Immortal Realms APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'immortal_realms_files.tar.gz'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract game
        run: tar -xzf immortal_realms_files.tar.gz

      - name: Prepare project
        run: |
          touch immortal_realms/__init__.py
          touch immortal_realms/screens/__init__.py

          sed -i 's/from screens.combat_screen import CombatScreen/from immortal_realms.screens.combat_screen import CombatScreen/' immortal_realms/main.py

          sed -i 's|^source.dir = .|source.dir = ..|' immortal_realms/buildozer.spec

          cat > main.py <<'PY'
          from immortal_realms.main import ImmortalRealmsApp

          ImmortalRealmsApp().run()
          PY

      - name: Build APK
        id: buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: immortal_realms
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Immortal-Realms-APK
          path: ${{ steps.buildozer.outputs.filename }}
